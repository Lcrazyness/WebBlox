<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WebBlox Studio</title>

    <link
        rel="stylesheet"
        href="studio.css"
    >

</head>


<body>

<div class="studio-app">


    <!-- ========================================================
         TOP BAR
         ======================================================== -->

    <header class="studio-topbar">

        <div class="studio-brand">

            <button
                id="backToPlayer"
                class="studio-back"
                type="button"
            >
                ←
            </button>

            <div class="studio-logo">
                W
            </div>

            <div class="studio-title">

                <strong>
                    WebBlox Studio
                </strong>

                <span>
                    Web editor
                </span>

            </div>

        </div>


        <nav class="studio-tabs">

            <button
                class="studio-tab active"
                type="button"
            >
                Home
            </button>

            <button
                class="studio-tab"
                type="button"
            >
                Model
            </button>

            <button
                class="studio-tab"
                type="button"
            >
                Test
            </button>

        </nav>


        <div class="studio-actions">

            <button
                id="newProjectButton"
                type="button"
            >
                New
            </button>

            <button
                id="saveProjectButton"
                type="button"
            >
                Save
            </button>

            <button
                id="playProjectButton"
                class="studio-play"
                type="button"
            >
                ▶ Play
            </button>

        </div>

    </header>


    <!-- ========================================================
         MAIN STUDIO
         ======================================================== -->

    <main class="studio-main">


        <!-- LEFT TOOLBAR -->

        <aside class="studio-left">

            <div class="panel-title">
                Tools
            </div>

            <button
                id="selectTool"
                class="tool-button active"
                type="button"
            >
                ↖ Select
            </button>

            <button
                id="moveTool"
                class="tool-button"
                type="button"
            >
                ✥ Move
            </button>

            <button
                id="scaleTool"
                class="tool-button"
                type="button"
            >
                ⤢ Scale
            </button>

            <button
                id="rotateTool"
                class="tool-button"
                type="button"
            >
                ⟳ Rotate
            </button>


            <div class="panel-divider"></div>


            <div class="panel-title">
                Insert
            </div>

            <button
                id="insertPartButton"
                class="insert-button"
                type="button"
            >
                + Part
            </button>

            <button
                id="insertSpawnButton"
                class="insert-button"
                type="button"
            >
                + Spawn
            </button>

        </aside>


        <!-- CENTER -->

        <section class="studio-center">


            <div class="viewport-toolbar">

                <span>
                    3D Viewport
                </span>

                <div class="viewport-tools">

                    <button
                        id="gridButton"
                        type="button"
                    >
                        Grid
                    </button>

                    <button
                        id="topViewButton"
                        type="button"
                    >
                        Top
                    </button>

                    <button
                        id="resetCameraButton"
                        type="button"
                    >
                        Reset
                    </button>

                </div>

            </div>


            <div
                id="viewport"
                class="viewport"
            >

                <div
                    id="world"
                    class="world"
                >

                    <div
                        id="spawnPoint"
                        class="spawn-point"
                    >
                        Spawn
                    </div>

                </div>


                <div class="viewport-help">

                    <span>
                        Drag = Orbit
                    </span>

                    <span>
                        Wheel = Zoom
                    </span>

                    <span>
                        Right click = Pan
                    </span>

                </div>

            </div>


            <div class="studio-output">

                <div class="output-title">
                    Output
                </div>

                <div
                    id="output"
                    class="output"
                ></div>

            </div>

        </section>


        <!-- RIGHT -->

        <aside class="studio-right">


            <div class="right-section">

                <div class="right-header">
                    Explorer
                </div>

                <div
                    id="explorer"
                    class="explorer"
                ></div>

            </div>


            <div class="right-section properties-section">

                <div class="right-header">
                    Properties
                </div>

                <div
                    id="properties"
                    class="properties"
                >

                    <div class="nothing-selected">

                        <strong>
                            Nothing selected
                        </strong>

                        <span>
                            Select an object
                        </span>

                    </div>

                </div>

            </div>


        </aside>

    </main>

</div>


<script src="studio.js"></script>

</body>

</html>
